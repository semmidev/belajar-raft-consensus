version: '3.8'

services:
  node1:
    build: .
    image: raft-server
    command: ["./raft-server", "-id=node1", "-raft-addr=node1:12000", "-http-addr=:8080", "-bootstrap=true"]
    ports:
      - "8081:8080"
    networks:
      - raft-net

  node2:
    image: raft-server
    command: ["./raft-server", "-id=node2", "-raft-addr=node2:12000", "-http-addr=:8080"]
    ports:
      - "8082:8080"
    depends_on:
      - node1
    networks:
      - raft-net

  node3:
    image: raft-server
    command: ["./raft-server", "-id=node3", "-raft-addr=node3:12000", "-http-addr=:8080"]
    ports:
      - "8083:8080"
    depends_on:
      - node1
    networks:
      - raft-net

  node4:
    image: raft-server
    command: ["./raft-server", "-id=node4", "-raft-addr=node4:12000", "-http-addr=:8080"]
    ports:
      - "8084:8080"
    depends_on:
      - node1
    networks:
      - raft-net

  node5:
    image: raft-server
    command: ["./raft-server", "-id=node5", "-raft-addr=node5:12000", "-http-addr=:8080"]
    ports:
      - "8085:8080"
    depends_on:
      - node1
    networks:
      - raft-net

networks:
  raft-net:
    driver: bridge